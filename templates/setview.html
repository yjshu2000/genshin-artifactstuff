<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifact Set Reference</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Artifact Set Reference</h1>

<div class="tabs">
  <div class="tab active" data-tab="sets">Sets → Chars</div>
  <div class="tab" data-tab="chars">Chars → Sets</div>
</div>

<div class="view active" id="view-sets">
  <table class="set-table">
    <thead><tr>
      <th class="col-num">#</th>
      <th>Set</th>
      <th>Characters</th>
    </tr></thead>
    <tbody id="sets-tbody"></tbody>
  </table>
</div>

<div class="view" id="view-chars">
  <table class="char-table">
    <thead><tr>
      <th>Character</th>
      <th>Sets</th>
    </tr></thead>
    <tbody id="chars-tbody"></tbody>
  </table>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
